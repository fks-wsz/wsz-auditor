###################################################
#                    基本配置                      #
##################################################
model = "gpt-5.4" # 模型
model_provider = "openai" # 提供商
log_dir = "./.codex-log" # 日志目录
web_search = "cached" # 网络搜索模式

###################################################
#                   思考与输出                     #
##################################################
model_reasoning_effort = "medium" # 思考推理等级
personality = "pragmatic" # 沟通风格

###################################################
#                  沙盒与审批策略                   #
##################################################
sandbox_mode = "workspace-write" # 工作区读写
approval_policy = "on-request" # 需要时提出审批
allow_login_shell = false # 禁止登录shell
[windows]
sandbox = "elevated"


###################################################
#                    功能与特性                    #
##################################################
[features]
multi_agent = true # 启用子代理协作工具
shell_snapshot = true # 快照 shell 环境，以加快重复命令的速度
shell_tool = true # 启用默认的 shell 工具

###################################################
#                  MCP Servers                   #
##################################################

[mcp_servers.playwright] # playwright
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.chrome_devtools]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "chrome-devtools-mcp@latest",
]
env = { SystemRoot="C:\\Windows", PROGRAMFILES="C:\\Program Files" }
startup_timeout_ms = 20_000


